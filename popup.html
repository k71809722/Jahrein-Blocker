<!DOCTYPE html>
<html lang="tr">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Engelleyici Ayarları</title>
  <link rel="stylesheet" href="popup.css">
</head>

<body>
  <div class="container">
    <header>
      <h1>Jahrein Engelleyici</h1>
      <label class="switch">
        <input type="checkbox" id="toggleExtension" checked>
        <span class="slider round"></span>
      </label>
    </header>

    <div class="status-text" id="statusText">Aktif</div>

    <div class="input-group">
      <input type="text" id="newKeyword" placeholder="Kelime (örn: jahrein)">
      <button id="addBtn">Ekle</button>
    </div>

    <div class="list-container">
      <h3>Engellenen Kelimeler</h3>
      <ul id="keywordList"></ul>
    </div>

    <div class="input-group" style="margin-top: 20px;">
      <input type="text" id="newUrl" placeholder="Link (örn: youtube.com/jahrein)">
      <button id="addUrlBtn">Ekle</button>
    </div>

    <div class="list-container">
      <h3>Engellenen Linkler</h3>
      <ul id="urlList"></ul>
    </div>
  </div>
  <script src="popup.js"></script>
</body>

</html>
