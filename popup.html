<!DOCTYPE html>
<html lang="tr">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jahrein Engelleyici</title>
  <link rel="stylesheet" href="popup.css">
</head>

<body>
  <div class="container">

    <!-- Header -->
    <header>
      <div class="logo-area">
        <h2>Jahrein<br>Engelleyici</h2>
        <span class="version" id="versionText">v1.0</span>
      </div>
      <div class="toggle-switch">
        <input type="checkbox" id="toggleExtension" checked>
        <label for="toggleExtension"></label>
      </div>
    </header>

    <!-- Stats Section (New) -->
    <div class="stats-card">
      <div class="stat-item">
        <span class="stat-label">Bugün</span>
        <span class="stat-value" id="dailyCount">0</span>
      </div>
      <div class="stat-divider"></div>
      <div class="stat-item">
        <span class="stat-label">Toplam</span>
        <span class="stat-value" id="totalCount">0</span>
      </div>
    </div>

    <div class="status-indicator">
      Durum: <span id="statusText">Aktif</span>
    </div>

    <!-- Mode Selection -->
    <div class="mode-selector">
      <h3>Engelleme Modu</h3>
      <div class="radio-group">
        <label class="radio-label">
          <input type="radio" name="blockMode" value="hide">
          <span class="radio-custom"></span>
          Gizle
        </label>
        <label class="radio-label">
          <input type="radio" name="blockMode" value="blur" checked>
          <span class="radio-custom"></span>
          Bulanıklaştır
        </label>
        <label class="radio-label">
          <input type="radio" name="blockMode" value="ghost">
          <span class="radio-custom"></span>
          Hayalet Mod
        </label>
      </div>
    </div>

    <!-- Tabs -->
    <div class="tabs">
      <button class="tab-btn active" data-tab="keywords">Kelimeler</button>
      <button class="tab-btn" data-tab="urls">Linkler</button>
      <button class="tab-btn" data-tab="stats">İstatistik</button>
    </div>

    <!-- Tab Content: Keywords -->
    <div id="keywords-tab" class="tab-content active">
      <div class="input-group">
        <input type="text" id="newKeyword" placeholder="Kelime ekle...">
        <button id="addBtn">+</button>
      </div>
      <ul id="keywordList" class="list"></ul>
    </div>

    <!-- Tab Content: URLs -->
    <div id="urls-tab" class="tab-content">
      <div class="input-group">
        <input type="text" id="newUrl" placeholder="URL ekle (örn: kick.com)">
        <button id="addUrlBtn">+</button>
      </div>
      <ul id="urlList" class="list"></ul>
    </div>

    <!-- Tab Content: Stats (New) -->
    <div id="stats-tab" class="tab-content">
      <div class="level-container">
        <div class="level-header">
          <span id="levelTitle">Seviye 1: Çaylak</span>
          <span id="levelProgressText">0/50 XP</span>
        </div>
        <div class="xp-bar">
          <div class="xp-fill" id="xpFill" style="width: 0%"></div>
        </div>
      </div>

      <h4 style="margin: 15px 0 10px 0; color: #888; font-size: 12px; text-transform: uppercase;">Rozetler</h4>
      <div class="badge-grid" id="badgeGrid">
        <!-- Badges will be injected here -->
      </div>
    </div>

  </div>
  <script src="popup.js"></script>
</body>

</html>
